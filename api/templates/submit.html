<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidScribe - Submit Video</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; background: #f5f5f5; }
        h1 { color: #333; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .divider { text-align: center; margin: 10px 0 20px; color: #999; }
        button { width: 100%; padding: 12px; background: #4a90e2; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #357abd; }
        .error { color: red; margin-bottom: 16px; }
    </style>
</head>
<body>
    <h1>VidScribe</h1>
    <p>Convert a video into a structured article.</p>
    <div class="card">
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post" action="/jobs" enctype="multipart/form-data">
            <label for="video_url">YouTube URL</label>
            <input type="text" id="video_url" name="video_url" placeholder="https://www.youtube.com/watch?v=...">
            <div class="divider">— or —</div>
            <label for="file">Upload Video File</label>
            <input type="file" id="file" name="file" accept="video/*">
            <button type="submit">Generate Article</button>
        </form>
    </div>
</body>
</html>
