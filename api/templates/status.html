<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidScribe - Processing</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; background: #f5f5f5; }
        h1 { color: #333; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); text-align: center; }
        .status { font-size: 20px; margin: 20px 0; color: #555; }
        .spinner { width: 48px; height: 48px; border: 5px solid #eee; border-top-color: #4a90e2; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .job-id { font-size: 12px; color: #aaa; margin-top: 20px; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>VidScribe</h1>
    <div class="card">
        <div class="spinner" id="spinner"></div>
        <div class="status" id="status-text">Processing your video...</div>
        <div class="job-id">Job ID: {{ job_id }}</div>
    </div>

    <script>
        const jobId = "{{ job_id }}";
        const statusText = document.getElementById("status-text");
        const spinner = document.getElementById("spinner");

        const poll = setInterval(async () => {
            try {
                const res = await fetch(`/jobs/${jobId}`);
                const status = await res.text();
                const clean = status.replace(/"/g, "");

                if (clean === "completed") {
                    clearInterval(poll);
                    statusText.textContent = "Done! Fetching your article...";
                    const articleRes = await fetch(`/articles/by-job/${jobId}`);
                    const articleId = await articleRes.text();
                    window.location.href = `/article/${articleId.replace(/"/g, "")}`;
                } else if (clean === "failed") {
                    clearInterval(poll);
                    spinner.style.display = "none";
                    statusText.className = "status error";
                    statusText.textContent = "Processing failed. Please try again.";
                } else {
                    statusText.textContent = `Status: ${clean}`;
                }
            } catch (e) {
                clearInterval(poll);
                statusText.className = "status error";
                statusText.textContent = "Error checking status.";
            }
        }, 3000);
    </script>
</body>
</html>
