[project]
name = "vidscribe-api"
version = "0.1.0"
description = "VidScribe API — video-to-article service"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.135",
    "uvicorn>=0.44",
    "asyncpg>=0.30",
    "pydantic>=2.13",
    "google-cloud-pubsub>=2.37",
    "google-cloud-storage>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # for FastAPI test client
]

